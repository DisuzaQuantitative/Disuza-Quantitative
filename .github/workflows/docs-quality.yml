name: Public documentation quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-surface:
    name: Public surface
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate public facts, claims, links, and anchors
        run: python scripts/check_public_surface.py

      - name: Install strict YAML validator dependency
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2

      - name: Validate YAML syntax and reject duplicate keys
        run: python scripts/validate_yaml.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.22.1

      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .lychee.toml
            './README.md'
            './CONTRIBUTING.md'
            './CHANGELOG.md'
            './NOTICE.md'
            './**/*.md'
            './.github/**/*.md'
            './CITATION.cff'
            './PUBLIC_FACTS.yml'
            './LICENSE'
          fail: true
          jobSummary: false
          lycheeVersion: "v0.23.0"
          output: /tmp/lychee.md

      - name: Validate citation metadata
        uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: "--validate"

      - name: Render canonical Mermaid diagram
        run: |
          python scripts/extract_mermaid.py \
            docs/architecture.md \
            /tmp/target-architecture.mmd
          npx --yes @mermaid-js/mermaid-cli@11.15.0 \
            --input /tmp/target-architecture.mmd \
            --output /tmp/target-architecture.svg \
            --puppeteerConfigFile scripts/mermaid-puppeteer-config.json \
            --quiet

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_ARCHIVE_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp gitleaks

      - name: Scan current tree for secrets with redacted output
        run: >-
          /tmp/gitleaks dir
          --redact=100
          --no-banner
          --no-color
          .
